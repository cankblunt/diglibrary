<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"
     role="img" aria-label="A Terminal window with the commands typed into it">
  <title>What the Terminal looks like while you follow the steps</title>
  <rect width="900" height="330" rx="12" fill="#0f1115"/>
  <rect x="0" y="0" width="900" height="38" rx="12" fill="#1e2128"/>
  <rect x="0" y="26" width="900" height="12" fill="#1e2128"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" font-size="12.5" fill="#9aa3b2"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">Terminal</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="24" y="70" fill="#6f7891">#  you type this  ↓</text>

    <text x="24" y="98"><tspan fill="#F2C230">➜</tspan><tspan fill="#eceff4" xml:space="preserve">  cd </tspan><tspan fill="#7fd1b9">~/Downloads/diglibrary-1.7.0</tspan></text>

    <text x="24" y="130"><tspan fill="#F2C230">➜</tspan><tspan fill="#eceff4" xml:space="preserve">  python3 -m venv .venv</tspan></text>

    <text x="24" y="162"><tspan fill="#F2C230">➜</tspan><tspan fill="#eceff4" xml:space="preserve">  .venv/bin/python -m pip install -e .</tspan></text>
    <text x="24" y="184" fill="#6f7891" xml:space="preserve">   Successfully installed diglibrary-1.7.0 mutagen-1.47 numpy-2.3 …</text>
    <text x="24" y="206" fill="#6f7891">   ↑ this line means it worked</text>

    <text x="24" y="240"><tspan fill="#F2C230">➜</tspan><tspan fill="#eceff4" xml:space="preserve">  .venv/bin/python -m diglibrary</tspan></text>
    <text x="24" y="262" fill="#6f7891">   ↑ the window opens. Leave this Terminal open while you use it.</text>

    <text x="24" y="298" fill="#7fd1b9" xml:space="preserve">   Tip: instead of typing a folder's name, type  cd  and then drag</text>
    <text x="24" y="316" fill="#7fd1b9" xml:space="preserve">        the folder from Finder onto the Terminal window.</text>
  </g>
</svg>
